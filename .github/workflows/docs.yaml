name: Documentation

on:
  push:
    branches: [main, develop]
    paths:
      - 'docs/**'
      - 'personal_agent_protocol/**'
      - 'src/**'
      - 'scripts/**'
      - 'protocol/**'
      - '.github/workflows/docs.yaml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'docs/**'
      - 'personal_agent_protocol/**'
      - 'src/**'
      - 'scripts/**'
      - 'protocol/**'
      - '.github/workflows/docs.yaml'
  workflow_dispatch:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: detect --source=/github/workspace --verbose --redact --no-banner

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python ../scripts/generate_api_reference.py --check
      - run: python -m pip install pyyaml && python ../scripts/generate_coverage.py --check
      - run: npm install --no-package-lock
      - run: npm run build
