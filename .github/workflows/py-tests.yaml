name: Py Tests

on:
  push:
    branches:
      - main
    paths:
      - 'personal_agent_protocol/**'
      - 'personal_agent_protocol/__tests__/**'
      - 'pyproject.toml'
      - 'setup.py'
      - 'requirements*.txt'
      - '**/*.py'
      - '.github/workflows/py-tests.yaml'
      - '.github/workflows/reusable-python.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'personal_agent_protocol/**'
      - 'personal_agent_protocol/__tests__/**'
      - 'pyproject.toml'
      - 'setup.py'
      - 'requirements*.txt'
      - '**/*.py'
      - '.github/workflows/py-tests.yaml'
      - '.github/workflows/reusable-python.yaml'

  workflow_dispatch:

jobs:
  tests:
    strategy:
      max-parallel: 1
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    uses: ./.github/workflows/reusable-python.yaml
    with:
      python-version: ${{ matrix.python-version }}
      install-extras: test
      run-tests: true
      test-command: pytest personal_agent_protocol/__tests__/ --cov=personal_agent_protocol --cov-report term-missing

  # The load tests at size, and the canary suite with the examples' tools.
  load-and-canaries:
    runs-on: ubuntu-latest
    env:
      PAP_LOAD_SIZE: '512'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: latest
          python-version: '3.12'
          activate-environment: true
      - run: uv pip install ".[test,examples]"
      - run: pytest -q -s -m load personal_agent_protocol/__tests__/test_load.py
      - run: pytest -q -s personal_agent_protocol/__tests__/test_canaries.py
