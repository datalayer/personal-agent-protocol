# Publishes the release a tag names to PyPI and npm without stored tokens.
# Each registry trusts this workflow through its own GitHub environment; the
# PyPI distributions carry attestations and the npm package provenance. The
# tag must name both package versions; versions already published are skipped.
# A pre-release tag (vX.Y.ZaN, bN or rcN: the Python version, as PEP 440 writes
# it) names the npm version X.Y.Z-alpha.N, -beta.N or -rc.N: PyPI takes it as a
# pre-release, npm publishes it under the dist-tag alpha, beta or rc, never
# latest, and the GitHub release is marked a pre-release. See RELEASE.md.

name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.plan.outputs.python }}
      typescript: ${{ steps.plan.outputs.typescript }}
      npm_version: ${{ steps.versions.outputs.npm_version }}
      dist_tag: ${{ steps.versions.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Use an npm CLI with trusted-publishing support
        run: npm install --global npm@latest

      - name: Check the tag names both package versions
        id: versions
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          python_version="$(python -c "import re;print(re.search(r'__version__\s*=\s*[\"\']([^\"\']+)', open('personal_agent_protocol/__version__.py').read())[1])")"
          typescript_version="$(node -p "require('./package.json').version")"
          # The tag is the Python version. A release is X.Y.Z on both registries; a
          # pre-release X.Y.ZaN, bN or rcN is X.Y.Z-alpha.N, -beta.N or -rc.N on npm,
          # published under that dist-tag so `latest` stays the last release.
          if [[ "$tag" =~ ^([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            npm_version="$tag"
            dist_tag="latest"
          elif [[ "$tag" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(a|b|rc)([0-9]+)$ ]]; then
            case "${BASH_REMATCH[2]}" in
              a) dist_tag="alpha" ;;
              b) dist_tag="beta" ;;
              rc) dist_tag="rc" ;;
            esac
            npm_version="${BASH_REMATCH[1]}-$dist_tag.${BASH_REMATCH[3]}"
          else
            echo "the tag $GITHUB_REF_NAME names no release (vX.Y.Z) or pre-release (vX.Y.ZaN, bN, rcN)"
            exit 1
          fi
          echo "tag=$tag python=$python_version typescript=$typescript_version npm=$npm_version dist-tag=$dist_tag"
          test "$tag" = "$python_version"
          test "$npm_version" = "$typescript_version"
          echo "npm_version=$npm_version" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"

      - name: Find which packages need publishing
        id: plan
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          status="$(curl -sL -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/personal-agent-protocol/$version/json")"
          if [ "$status" = "200" ]; then
            echo "PyPI: personal-agent-protocol $version is already published, skipping"
            echo "python=" >> "$GITHUB_OUTPUT"
          else
            echo "PyPI: personal-agent-protocol $version will be published"
            echo "python=yes" >> "$GITHUB_OUTPUT"
          fi
          npm_version="${{ steps.versions.outputs.npm_version }}"
          if npm view "@datalayer/personal-agent-protocol@$npm_version" version --json >/dev/null 2>&1; then
            echo "npm: @datalayer/personal-agent-protocol $npm_version is already published, skipping"
            echo "typescript=" >> "$GITHUB_OUTPUT"
          else
            echo "npm: @datalayer/personal-agent-protocol $npm_version will be published"
            echo "typescript=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Python distributions
        if: steps.plan.outputs.python != ''
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build
          python -m build --sdist --wheel --outdir dist .
          ls -la dist

      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.python != ''
        with:
          name: python
          path: dist/*

      - name: Build and test the TypeScript package
        if: steps.plan.outputs.typescript != ''
        run: |
          set -euo pipefail
          npm install --no-package-lock
          npm test
          mkdir -p npm-dist
          npm pack . --pack-destination npm-dist
          ls -la npm-dist

      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.typescript != ''
        with:
          name: npm
          path: npm-dist/*

  # The compatibility and conformance report for this release: every language pairing
  # over TLS, published with the release's workflow run (artifact conformance-report).
  conformance:
    runs-on: ubuntu-latest
    env:
      PAP_CONFORMANCE_REPORTS: conformance-report
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v7
        with:
          version: latest
          python-version: '3.12'
          activate-environment: true
      - run: npm install --no-package-lock
      - run: npm run build
      - run: uv pip install ".[test]"
      - name: Run every pairing and generate the report
        run: |
          set -euo pipefail
          pytest -q personal_agent_protocol/__tests__/test_conformance.py \
            personal_agent_protocol/__tests__/test_cross_language.py
          node --test src/__tests__/conformance-pairing.test.mjs
          python scripts/conformance_report.py conformance-report \
            --output conformance-report/conformance-report.mdx
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: conformance-report

  pypi:
    needs: build
    if: needs.build.outputs.python != ''
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python
          path: dist
      # Trusted publishing (OIDC, no token) with PEP 740 attestations: each
      # distribution is signed for this workflow run and tag.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          attestations: true

  npm:
    needs: build
    if: needs.build.outputs.typescript != ''
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Use an npm CLI with trusted-publishing support
        run: npm install --global npm@latest
      - uses: actions/download-artifact@v4
        with:
          name: npm
          path: npm-dist
      # Trusted publishing (OIDC, no token) with a provenance statement naming
      # this workflow run and tag. The dist-tag is `latest` for a release and
      # `alpha`, `beta` or `rc` for a pre-release, which `npm install` without a
      # tag never picks.
      - name: Publish with npm trusted publishing and provenance
        run: npm publish ./npm-dist/*.tgz --access public --provenance --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}

  release:
    name: GitHub release
    needs: [build, pypi, npm]
    if: >-
      always() &&
      needs.build.result == 'success' &&
      needs.pypi.result != 'failure' &&
      needs.npm.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Create the release with generated notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
          title="Release $version"
          flags=()
          if [ "$DIST_TAG" != "latest" ]; then
            # A pre-release: marked as one, and never the repository's latest release.
            title="Pre-release $version"
            flags=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" --title "$title" --generate-notes "${flags[@]}" \
            --notes "- [PyPI personal-agent-protocol](https://pypi.org/project/personal-agent-protocol/$version/)
          - [npm @datalayer/personal-agent-protocol](https://www.npmjs.com/package/@datalayer/personal-agent-protocol/v/$NPM_VERSION)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
          NPM_VERSION: ${{ needs.build.outputs.npm_version }}
