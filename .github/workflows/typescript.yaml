name: TypeScript

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'src/__tests__/**'
      - 'tsconfig.json'
      - 'protocol/fixtures/**'
      - 'package.json'
      - '.github/workflows/typescript.yaml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'src/__tests__/**'
      - 'tsconfig.json'
      - 'protocol/fixtures/**'
      - 'package.json'
      - '.github/workflows/typescript.yaml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npm run typecheck
      - run: npm test
