name: TypeScript

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/typescript/**'
      - 'protocol/fixtures/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/typescript.yaml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/typescript/**'
      - 'protocol/fixtures/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/typescript.yaml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
