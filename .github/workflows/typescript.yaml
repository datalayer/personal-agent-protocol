name: TypeScript

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'src/__tests__/**'
      - 'tsconfig.json'
      - 'protocol/**'
      - 'personal_agent_protocol/**'
      - 'scripts/conformance_report.py'
      - 'package.json'
      - 'README.md'
      - 'docs/docs/**'
      - '.github/workflows/typescript.yaml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'src/__tests__/**'
      - 'tsconfig.json'
      - 'protocol/**'
      - 'personal_agent_protocol/**'
      - 'scripts/conformance_report.py'
      - 'package.json'
      - 'README.md'
      - 'docs/docs/**'
      - '.github/workflows/typescript.yaml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npm run typecheck
      - run: npm test
      - name: Load tests at size
        run: node --test src/__tests__/load.test.mjs
        env:
          PAP_LOAD_SIZE: '512'

  # Every language pairing runs the conformance suite over TLS, and the
  # compatibility report is generated from their JSON reports.
  pairings:
    runs-on: ubuntu-latest
    env:
      PAP_CONFORMANCE_REPORTS: conformance-reports
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v7
        with:
          version: latest
          python-version: '3.12'
          activate-environment: true
      - run: npm install --no-package-lock
      - run: npm run build
      - run: uv pip install ".[test]"
      - name: Python and TypeScript agents against Python and TypeScript companies
        run: |
          pytest -q personal_agent_protocol/__tests__/test_conformance.py \
            personal_agent_protocol/__tests__/test_pairings.py \
            personal_agent_protocol/__tests__/test_cross_language.py
          node --test src/__tests__/conformance-pairing.test.mjs
          test "$(ls conformance-reports/*-company.json | wc -l)" = 4
          test "$(ls conformance-reports/*.dpop-binding.json | wc -l)" = 4
          test "$(ls conformance-reports/*.no-issuer.json | wc -l)" = 4
          test "$(ls conformance-reports/*.operator-signatures.json | wc -l)" = 4
          test "$(ls conformance-reports/*.operator-signatures-required.json | wc -l)" = 4
      - name: Compatibility and conformance report
        run: |
          python scripts/conformance_report.py conformance-reports \
            --output conformance-reports/conformance-report.mdx
          python scripts/conformance_report.py conformance-reports --check
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-reports
          path: conformance-reports
