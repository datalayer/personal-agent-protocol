- id: PAP-3-01
  section: '3'
  level: MUST
  role: company
  text: A Company MUST publish its poppy.json document at https://{domain}/.well-known/poppy.json over
    HTTPS, where {domain} is the Company's domain or a subdomain it controls.
  status: implemented
  implementation:
