  - personal_agent_protocol/__tests__/test_guidance.py::test_writes_and_long_pauses_go_back_to_the_caller_and_are_shared
- id: GUIDE-rate-03
  source: guide
  section: Rate limits
  level: SHOULD
  role: company
  text: Count a request against a client_id only after its Session JWT or client assertion's signature
    checks pass. Limit unverified requests by network instead.
