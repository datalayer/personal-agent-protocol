  - personal_agent_protocol/__tests__/test_guidance.py::test_safe_requests_retry_after_retry_after_with_fresh_session_jwts
- id: GUIDE-retry-04
  source: guide
  section: Retries
  level: SHOULD
  role: company
  text: Companies keep idempotency records for a set time, such as a day, scoped to the session. They
    return the original response for a repeated key, and reject a repeated key with a different body.
  status: implemented
