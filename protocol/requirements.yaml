  - personal_agent_protocol/__tests__/test_conformance.py::test_python_agent_python_company_over_tls
  reason: The SDK's DPoP keys are P-256 and sign ES256, which every company and DPoP MCP server accepts;
    a host that contributes an RS256 DPoP key is not checked against the company's list.
