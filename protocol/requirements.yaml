  - personal_agent_protocol/__tests__/test_idempotency.py::test_a_bad_key_or_a_key_on_a_read_is_the_callers_mistake
- id: GUIDE-retry-02
  source: guide
  section: Retries
  level: SHOULD
  role: personal-agent
  text: Each retry needs a new Session JWT, and a new DPoP proof if the access token is DPoP-bound. A
    retried token request needs a new assertion.
