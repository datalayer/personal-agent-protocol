  - personal_agent_protocol/__tests__/test_dpop.py::test_a_resource_nonce_is_retried_once_and_the_latest_kept_for_the_origin
  - personal_agent_protocol/__tests__/test_dpop.py::test_use_dpop_nonce_is_retried_once_with_a_fresh_proof_and_assertion
  - personal_agent_protocol/__tests__/test_dpop.py::test_a_restarted_session_sends_a_fresh_proof_and_a_redirect_is_refused
  conformance:
  - dpop.nonce-at-the-token-endpoint
  - dpop.nonce-at-a-resource
- id: GUIDE-retry-03
  source: guide
  section: Retries
  level: SHOULD
  role: personal-agent
  text: Otherwise, back off exponentially with jitter, cap the delay, and limit the number of attempts.
  status: implemented
  implementation:
  - personal_agent_protocol.reactor:RetryPolicy
  - personal_agent_protocol.transport:SessionHttpClient.request
