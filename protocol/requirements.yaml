- id: GUIDE-co-sessions-01
  source: guide
  section: Token lifetimes and sign-out
  level: SHOULD
  role: company
  text: Don't stop accepted work because the access token that started it expired. A job can outlast the
    token.
  status: partial
  implementation:
  - personal_agent_protocol.company.service:CompanyService.settle
  - personal_agent_protocol.company.service:CompanyService._perform
  tests:
  - personal_agent_protocol/__tests__/test_operations.py::test_operations_are_used_only_when_both_sides_list_version_2
  reason: An operation in progress is settled by the company (settle) whatever its Session Token; no test
    lets a token expire mid-work.
- id: GUIDE-co-sessions-02
  source: guide
  section: Token lifetimes and sign-out
  level: SHOULD
  role: company
  text: Where work in progress can take consequential actions on the user's account, such as payments
    or changes that are hard to undo, tie it to the refresh token, so revoking access stops it right away.
  status: not-applicable
  reason: The reference company performs an operation when it is confirmed; nothing runs on the account
    afterwards that revocation would need to stop.
  implementation: []
  tests: []
- id: GUIDE-co-hosting-01
  source: guide
  section: Hosting several companies
  level: SHOULD
  role: company
  text: 'Each company needs its own issuer (3.2): publish metadata for each issuer at its own URL, and
    serve each storefront''s poppy.json on its own domain. Record the issuer with every session and token,
    and check it on every request.'
  status: not-applicable
  reason: The reference company is one company per CompanyService and store; a provider runs one per company,
    each with its own issuer and records.
  implementation: []
  tests: []
- id: GUIDE-co-account-01
  source: guide
  section: Account settings
  level: SHOULD
  role: company
  text: Offer a control to disconnect each one. Disconnecting revokes its refresh tokens and access tokens,
    and its sessions continue signed out (5.5).
