- id: PAP-3.2-10
  section: '3.2'
  level: MUST
  role: company
  text: A Company MAY list the algorithms it accepts in dpop_signing_alg_values_supported, as RFC 9449
    §5.1 defines, and the list MUST then include ES256.
  status: not-applicable
  implementation:
  - personal_agent_protocol.company.service:CompanyService.oauth_metadata
  reason: Withdrawn upstream (3e9bada) with Poppy's DPoP rules; the reference company issues Bearer
    access tokens and lists no dpop_signing_alg_values_supported.
- id: PAP-3.2-11
  section: '3.2'
  level: MUST
  role: personal-agent
  text: Personal Agents MUST sign DPoP Proofs with ES256 or with an algorithm from that list, except at
    an MCP server, where the list in the server's protected resource metadata applies (4.3).
  status: partial
  implementation:
  - personal_agent_protocol.crypto:JoseDpopProofProvider
  - personal_agent_protocol.crypto:InMemorySessionKeys
  - personal_agent_protocol.cli_host:FileKeyStore.generate
  tests:
