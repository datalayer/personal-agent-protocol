# Personal Agent Protocol draft 0.3 and Operations v1: the normative requirement ledger.
#
# requirements: every MUST, MUST NOT, SHOULD, and SHOULD NOT of the specification
# (source: spec, the default) and the Operations extension (source: operations),
# one atomic statement per entry, with the upstream text that states it.
# guide: recommendations from the upstream Guides (source: guide), kept apart.
#
# implementation: module:symbol under personal_agent_protocol.
# tests: file::test name; conformance: fixture case IDs (protocol/fixtures/conformance),
# run by test_fixtures.py (decided by the SDK) or by the conformance runner
# (test_conformance.py, against the reference company over TLS).
# status: implemented | partial | open | not-applicable, with a reason unless implemented.
# test_requirements.py checks every test and case exists.

protocol: personal-agent-protocol
profile: '0.3'
upstream_revision: '2026-10-26'
reviewed: '2026-10-27'
sources:
  spec: https://personalagentprotocol.org/docs/0.3/spec
  operations: https://personalagentprotocol.org/docs/0.3/extensions/operations
  guide: https://personalagentprotocol.org/docs/0.3/guides
