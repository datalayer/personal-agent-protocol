  - personal_agent_protocol/__tests__/test_fuzz.py::test_strict_json_accepts_every_unique_document_and_refuses_every_duplicate
  conformance:
  - security.duplicate-json-members
- id: GUIDE-pa-session-01
  source: guide
  section: The Session header
  level: SHOULD
  role: personal-agent
  text: Generate delegated keys where you sign, and make them non-extractable where your platform allows.
    Use each one for one user ID only (MUST, 5.2).
  status: implemented
  implementation:
  - personal_agent_protocol.reactor:SessionJwtRequest
  - personal_agent_protocol.crypto:InMemoryDelegatedKeys
  tests:
  - personal_agent_protocol/__tests__/test_conformance.py::test_python_agent_python_company_over_tls
- id: GUIDE-pa-session-02
  source: guide
  section: The Session header
  level: SHOULD
  role: personal-agent
  text: Get a new delegation before the current one expires. You MUST NOT sign a Session JWT after its
    delegation's exp (5.2). Round its iat down, such as to the start of the hour, and set exp from the
    rounded value, so delegations issued together can't be matched by their times.
  status: partial
  implementation:
  - personal_agent_protocol.crypto:DelegatedSessionSigner
  - personal_agent_protocol.crypto:InMemoryDelegatedKeys
  tests:
  - personal_agent_protocol/__tests__/test_delegated_keys.py::test_a_delegation_is_rotated_before_it_expires_and_never_signed_past
  - personal_agent_protocol/__tests__/test_delegated_keys.py::test_a_session_jwt_has_the_specs_header_and_claims
  reason: Delegations are renewed before they expire and never signed past; their iat is the signing time,
    not rounded down.
- id: GUIDE-pa-session-03
  source: guide
  section: The Session header
  level: SHOULD
  role: personal-agent
  text: If a company issues DPoP-bound access tokens, also sign a DPoP proof for each request that carries
    one, and support nonces as RFC 9449 §8 describes. The proof and the Session JWT are separate signatures
    with separate keys (5.2).
  status: implemented
  implementation:
  - personal_agent_protocol.transport:session_headers
  - personal_agent_protocol.transport:SessionHttpClient.request
  - personal_agent_protocol.mcp:McpSessionAuth
  - personal_agent_protocol.crypto:JoseDpopProver
  tests:
  - personal_agent_protocol/__tests__/test_dpop.py::test_a_dpop_token_goes_with_a_proof_and_the_session_header
  - personal_agent_protocol/__tests__/test_dpop.py::test_a_resource_nonce_is_retried_once_and_the_latest_kept_for_the_origin
  - personal_agent_protocol/__tests__/test_conformance.py::test_python_agent_python_company_binding_with_dpop_over_tls
  conformance:
  - dpop.token-bound-and-used
  - dpop.session-and-proof-different-keys
  - dpop.nonce-at-the-token-endpoint
  - dpop.nonce-at-a-resource
  - dpop.conversation-and-stream
  - dpop.feedback
  - dpop.browser-join
  - dpop.mcp-token-bound
- id: GUIDE-pa-discovery-01
  source: guide
