guide:
- id: GUIDE-secrets-01
  source: guide
  section: Handling secrets
  level: SHOULD
  role: both
  text: Keep them out of logs, telemetry, error reports, model context, conversation messages, and URLs.
  status: partial
  implementation:
  - personal_agent_protocol.errors:PersonalAgentProtocolError
  tests:
  - personal_agent_protocol/__tests__/test_accounts.py::test_no_error_carries_the_refresh_token
  - personal_agent_protocol/__tests__/test_sessions.py::test_session_error_never_includes_remote_error_description
  - personal_agent_protocol/__tests__/test_conformance.py::test_python_agent_python_company_over_tls
  conformance:
  - security.refusals-disclose-no-credential
  reason: Errors and results are credential-free; logs and traces are not yet covered by a test.
- id: GUIDE-secrets-02
  source: guide
  section: Handling secrets
  level: SHOULD
  role: both
  text: Redact the Authorization, Poppy-Session, DPoP, and Cookie headers and credential fields before
    a request reaches a logger or tracer.
  status: open
  reason: No logging or tracing hook redacts headers yet.
  implementation: []
  tests: []
- id: GUIDE-secrets-03
  source: guide
  section: Handling secrets
  level: SHOULD
  role: company
  text: 'Send Cache-Control: no-store on every response that carries a token or code.'
  status: implemented
  implementation:
  - personal_agent_protocol.company.service:CompanyService._issue
  - personal_agent_protocol.company.service:CompanyService._device
  tests:
  - personal_agent_protocol/__tests__/test_conformance.py::test_python_agent_python_company_over_tls
  conformance:
  - security.token-responses-not-cached
- id: GUIDE-jwt-01
  source: guide
  section: Signing and verifying JWTs
  level: SHOULD
  role: both
  text: 'Personal agents: sign Session JWTs with ES256 (MUST, 5.2). Sign client assertions and delegations
    with ES256, or with PS384 if you sign them blindly (10.7). Companies: accept ES256 and PS384 in client
    assertions and delegations (MUST, 4.1, 5.2), and RS256 in client assertions. Use RSA keys of at least
    2048 bits.'
  status: partial
  implementation:
  - personal_agent_protocol.crypto:JoseSigner
  - personal_agent_protocol.crypto:_algorithm
  tests:
  - personal_agent_protocol/__tests__/test_crypto.py::test_signs_and_verifies_only_asymmetric_pap_assertions
  - personal_agent_protocol/__tests__/test_conformance.py::test_python_agent_python_company_over_tls
  conformance:
  - security.client-assertion-ps384-header-on-ec-key
  reason: Companies accept ES256 and PS384 alone, not RS256; RSA key size is checked for blind keys only.
- id: GUIDE-jwt-02
  source: guide
  section: Signing and verifying JWTs
  level: SHOULD
  role: both
  text: 'Reject alg: none and symmetric algorithms such as HS256.'
  status: implemented
  implementation:
  - personal_agent_protocol.crypto:_algorithm
  - personal_agent_protocol.company.verify:verify_assertion
  tests:
  - personal_agent_protocol/__tests__/test_crypto.py::test_rejects_symmetric_and_none_algorithms
  - personal_agent_protocol/__tests__/test_conformance.py::test_python_agent_python_company_over_tls
  conformance:
  - security.client-assertion-alg-none
  - security.client-assertion-hs256-public-key
  - security.client-assertion-ps384-header-on-ec-key
- id: GUIDE-jwt-03
  source: guide
  section: Signing and verifying JWTs
  level: SHOULD
  role: company
  text: Verify client assertions and delegations only with keys from the personal agent's verified jwks_uri
    (4.1), and Session JWTs only with the key their verified delegation names in cnf.jwk (5.2). Ignore
    jku, x5u, and any other key embedded in a JWT.
  status: implemented
  implementation:
  - personal_agent_protocol.company.verify:verify_assertion
  tests:
  - personal_agent_protocol/__tests__/test_conformance.py::test_python_agent_python_company_over_tls
  conformance:
  - security.client-assertion-embedded-key-ignored
- id: GUIDE-jwt-04
  source: guide
  section: Signing and verifying JWTs
  level: SHOULD
  role: company
  text: 'Check aud and iat, and exp on client assertions and delegations. Session JWTs have no exp: accept
    them only within your iat window (5.3). A client assertion or Session JWT has the company''s issuer
    as its aud, never an endpoint URL (4.1, 5.2). Allow a small clock skew, such as 30 seconds, and reject
    assertions that claim a long lifetime.'
  status: implemented
  implementation:
  - personal_agent_protocol.company.verify:verify_assertion
  tests:
  - personal_agent_protocol/__tests__/test_conformance.py::test_python_agent_python_company_over_tls
  conformance:
  - security.client-assertion-audience-array
- id: GUIDE-jwt-05
  source: guide
  section: Signing and verifying JWTs
  level: SHOULD
  role: both
  text: Make the jti of each client assertion, delegation, Session JWT, and DPoP proof at least 128 random
    bits, and each Session ID too.
  status: implemented
  implementation:
  - personal_agent_protocol.sessions:_opaque_id
  - personal_agent_protocol.crypto:dpop_proof_claims
  tests:
  - personal_agent_protocol/__tests__/test_conformance.py::test_python_agent_python_company_over_tls
  - personal_agent_protocol/__tests__/test_dpop.py::test_a_proof_needs_128_random_bits_and_a_timezone
  conformance:
  - dpop.proof-shape
- id: GUIDE-keys-01
  source: guide
  section: Rotating keys
  level: SHOULD
  role: personal-agent
  text: Give every key in jwks_uri a kid.
  status: implemented
  implementation:
  - personal_agent_protocol.crypto:JoseSigner
  - personal_agent_protocol.demo.kit:AgentIdentity.jwks
  tests:
  - personal_agent_protocol/__tests__/test_identity.py::test_fetches_metadata_and_public_jwks
- id: GUIDE-keys-02
