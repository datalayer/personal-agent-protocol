    no other Company. Personal agents find an issuer with a path at its RFC 8414 URL (discovery._metadata_url,
    protocol.issuer-with-a-path).
- id: PAP-3.2-09
  section: '3.2'
  level: MUST
  role: company
  text: Companies MUST accept DPoP Proofs (4.3) signed with ES256, so every Personal Agent has an algorithm
    that works at every Company.
  status: implemented
