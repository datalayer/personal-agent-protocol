  reason: The stream opens with a comment and ends after the backlog; it does not stay open with keep-alives.
  tests: []
- id: GUIDE-co-conv-02
  source: guide
  section: Conversations
  level: SHOULD
  role: company
  text: When a session signs out, answer requests without an access token on its conversations that used
