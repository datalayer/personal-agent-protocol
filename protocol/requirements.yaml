  status: implemented
  implementation:
  - personal_agent_protocol.ui:PapConfirm
  - personal_agent_protocol.operations:terms_digest
  tests:
  - personal_agent_protocol/__tests__/test_ui.py::test_an_operation_to_confirm_is_the_committed_display_both_sdks_read
- id: OPS-6-01
  source: operations
  section: '6'
  level: SHOULD
  role: company
  text: While it is in_progress, the Company SHOULD include Retry-After, and the Personal Agent reads
    again after that time.
  status: implemented
  implementation:
  - personal_agent_protocol.company.service:CompanyService._operation_response
  - personal_agent_protocol.operations:ConfirmOutcome.retry_after
  tests:
  - personal_agent_protocol/__tests__/test_conformance.py::test_python_agent_python_company_over_tls
  conformance:
  - operations.in-progress-outcome-unknown
- id: OPS-6-02
  source: operations
  section: '6'
  level: MUST
  role: company
  text: The Company MUST perform each operation at most once, however many times and through whichever
    channels it is confirmed.
  status: implemented
  implementation:
  - personal_agent_protocol.company.store:CompanyStore
  - personal_agent_protocol.company.service:CompanyService._confirm_operation
  - personal_agent_protocol.company.service:CompanyService._operation_page
  tests:
  - personal_agent_protocol/__tests__/test_company_store.py::test_a_company_restarted_over_its_store_continues_every_flow
  - personal_agent_protocol/__tests__/test_company_store.py::test_the_memory_store_keeps_the_contract
  - personal_agent_protocol/__tests__/test_mcp_and_web.py::test_the_operation_confirmed_on_the_website_is_the_same_operation_once
  - personal_agent_protocol/__tests__/test_company_refusals.py::test_a_revised_operation_is_terms_changed_and_never_performed_twice
  - personal_agent_protocol/__tests__/test_conformance.py::test_python_agent_python_company_over_tls
  conformance:
  - operations.at-most-once
  - operations.web-confirm-at-most-once
  - operations.cancel-proposed
- id: OPS-6-03
  source: operations
  section: '6'
  level: MUST NOT
  role: company
  text: The Company MUST NOT report failed while it doesn't know whether the action took effect, for example
    after a timeout in one of its own systems.
  status: implemented
  implementation:
  - personal_agent_protocol.company.points:OperationOutcomeUnknown
  - personal_agent_protocol.company.service:CompanyService._confirm
  tests:
  - personal_agent_protocol/__tests__/test_conformance.py::test_python_agent_python_company_over_tls
  conformance:
  - operations.in-progress-outcome-unknown
- id: OPS-6-04
  source: operations
  section: '6'
  level: MUST NOT
  role: personal-agent
  text: If a confirm request fails or times out, the Personal Agent retries it or reads the operation,
    with the same operation ID. It MUST NOT ask for a new proposal of the same action until the operation
    is final.
  status: implemented
  implementation:
  - personal_agent_protocol.operations:OperationsClient.confirm
  tests:
  - personal_agent_protocol/__tests__/test_operations.py::test_a_lost_answer_is_read_back_by_the_same_id_never_assumed_failed
  - personal_agent_protocol/__tests__/test_conformance.py::test_python_agent_python_company_over_tls
  conformance:
  - operations.confirm-timeout-recovery
- id: OPS-6-05
  source: operations
  section: '6'
  level: MUST
  role: company
  text: In a final state, result.summary MUST describe every change that was made, including any made
    by an operation that failed or was cancelled partway.
  status: implemented
  implementation:
  - personal_agent_protocol.company.points:OperationFailed
  - personal_agent_protocol.company.service:CompanyService._confirm
  tests:
  - personal_agent_protocol/__tests__/test_conformance.py::test_python_agent_python_company_over_tls
  conformance:
  - operations.confirm-succeeded
  - operations.failed-partial-result
guide:
- id: GUIDE-secrets-01
  source: guide
  section: Handling secrets
  level: SHOULD
  role: both
  text: Keep them out of logs, telemetry, error reports, model context, conversation messages, and URLs.
  status: partial
  implementation:
  - personal_agent_protocol.errors:PersonalAgentProtocolError
  tests:
  - personal_agent_protocol/__tests__/test_accounts.py::test_no_error_carries_the_account_token
  - personal_agent_protocol/__tests__/test_sessions.py::test_session_error_never_includes_remote_error_description
  - personal_agent_protocol/__tests__/test_conformance.py::test_python_agent_python_company_over_tls
  conformance:
  - security.refusals-disclose-no-credential
  reason: Errors and results are credential-free; logs and traces are not yet covered by a test.
- id: GUIDE-secrets-02
  source: guide
  section: Handling secrets
  level: SHOULD
  role: both
  text: Redact the Authorization, DPoP, and Cookie headers and credential fields before a request reaches
    a logger or tracer.
  status: open
  reason: No logging or tracing hook redacts headers yet.
  implementation: []
- id: GUIDE-secrets-03
  source: guide
  section: Handling secrets
  level: SHOULD
  role: company
  text: 'Send Cache-Control: no-store on every response that carries a token or code.'
  status: implemented
  implementation:
  - personal_agent_protocol.company.service:CompanyService._issue
  - personal_agent_protocol.company.service:CompanyService._device
  tests:
  - personal_agent_protocol/__tests__/test_conformance.py::test_python_agent_python_company_over_tls
  conformance:
  - security.token-responses-not-cached
- id: GUIDE-jwt-01
  source: guide
  section: Signing and verifying JWTs
  level: SHOULD
  role: both
  text: Support ES256 and RS256, and sign with ES256 when you can. Use RSA keys of at least 2048 bits.
  status: partial
  implementation:
  - personal_agent_protocol.crypto:JoseSigner
  - personal_agent_protocol.crypto:_algorithm
  tests:
  - personal_agent_protocol/__tests__/test_crypto.py::test_signs_and_verifies_only_asymmetric_pap_assertions
  - personal_agent_protocol/__tests__/test_conformance.py::test_python_agent_python_company_over_tls
  conformance:
  - security.client-assertion-rs256-header-on-ec-key
  reason: RSA key size is not checked.
- id: GUIDE-jwt-02
  source: guide
  section: Signing and verifying JWTs
  level: SHOULD
  role: both
  text: 'Reject alg: none and symmetric algorithms such as HS256.'
  status: implemented
  implementation:
  - personal_agent_protocol.crypto:_algorithm
  - personal_agent_protocol.company.verify:verify_assertion
  tests:
  - personal_agent_protocol/__tests__/test_crypto.py::test_rejects_symmetric_and_none_algorithms
  - personal_agent_protocol/__tests__/test_conformance.py::test_python_agent_python_company_over_tls
  conformance:
  - security.client-assertion-alg-none
  - security.client-assertion-hs256-public-key
  - security.client-assertion-rs256-header-on-ec-key
  - security.dpop-alg-none
- id: GUIDE-jwt-03
  source: guide
  section: Signing and verifying JWTs
  level: SHOULD
  role: company
  text: Verify assertions only with keys from the personal agent's verified jwks_uri (4.1). Ignore jku,
    x5u, and any key embedded in an assertion.
  status: implemented
  implementation:
  - personal_agent_protocol.company.verify:verify_assertion
  tests:
  - personal_agent_protocol/__tests__/test_conformance.py::test_python_agent_python_company_over_tls
  conformance:
  - security.client-assertion-embedded-key-ignored
  - security.session-assertion-wrong-issuer
- id: GUIDE-jwt-04
  source: guide
  section: Signing and verifying JWTs
  level: SHOULD
  role: company
  text: Check aud, exp, and iat. A client assertion or Session assertion has the company's auth.issuer
    as its aud, never an endpoint URL (4.1). Allow a small clock skew, such as 30 seconds, and reject
    assertions that claim a long lifetime.
  status: implemented
  implementation:
  - personal_agent_protocol.company.verify:verify_assertion
  tests:
  - personal_agent_protocol/__tests__/test_conformance.py::test_python_agent_python_company_over_tls
  conformance:
  - security.client-assertion-bad-audience
  - security.client-assertion-audience-array
  - security.session-assertion-bad-audience
  - security.session-assertion-clock-skew-tolerated
  - security.session-assertion-from-the-future
  - security.session-assertion-expired
  - security.session-assertion-long-lived
- id: GUIDE-jwt-05
  source: guide
  section: Signing and verifying JWTs
  level: SHOULD
  role: both
  text: Make each jti at least 128 random bits.
  status: implemented
  implementation:
  - personal_agent_protocol.sessions:_opaque_id
  tests:
  - personal_agent_protocol/__tests__/test_sessions.py::test_builds_short_lived_session_assertion_claims
  - personal_agent_protocol/__tests__/test_conformance.py::test_python_agent_python_company_over_tls
  conformance:
  - security.session-assertion-replay
- id: GUIDE-keys-01
  source: guide
  section: Rotating keys
  level: SHOULD
  role: personal-agent
  text: Give every key a kid.
  status: implemented
  implementation:
  - personal_agent_protocol.crypto:JoseSigner
  - personal_agent_protocol.demo.kit:AgentIdentity.jwks
  tests:
  - personal_agent_protocol/__tests__/test_identity.py::test_fetches_metadata_and_public_jwks
- id: GUIDE-keys-02
  source: guide
  section: Rotating keys
  level: SHOULD
  role: company
  text: Companies refetch jwks_uri when they see an unknown kid. Refetch each jwks_uri at most once per
    interval, such as 30 seconds, and count failed fetches too.
  status: implemented
  implementation:
  - personal_agent_protocol.identity:AgentIdentityClient.fetch_jwks
  - personal_agent_protocol.company:IdentityClientResolver.resolve
  tests:
  - personal_agent_protocol/__tests__/test_guidance.py::test_unknown_kid_refetches_the_overlapping_jwks_rate_limited
  - personal_agent_protocol/__tests__/test_guide_security.py::test_overlapping_jwks_verify_either_key_then_refuse_the_retired_one
  - personal_agent_protocol/__tests__/test_guide_security.py::test_unknown_kids_refetch_the_set_at_most_once_a_minute
- id: GUIDE-fetch-01
  source: guide
  section: Fetching metadata safely
  level: SHOULD
  role: both
  text: 'Set limits: a few redirects at most, a response size such as 100 KB, and a timeout of a few seconds.'
  status: implemented
  implementation:
  - personal_agent_protocol.discovery:DiscoveryClient._get_json
  - personal_agent_protocol.identity:AgentIdentityClient._get_json
  - personal_agent_protocol.reactor:HttpxDiscoveryTransport.get
  tests:
  - personal_agent_protocol/__tests__/test_fixtures.py::test_local_fixture_case
  conformance:
  - security.discovery-redirect-limit
  - security.oversized-metadata
  - security.slow-metadata
  - security.metadata-not-json
- id: GUIDE-fetch-02
  source: guide
  section: Fetching metadata safely
  level: SHOULD
  role: both
  text: Never send cookies, tokens, or other credentials on these fetches.
  status: implemented
  implementation:
  - personal_agent_protocol.reactor:HttpxDiscoveryTransport.get
  tests:
  - personal_agent_protocol/__tests__/test_discovery.py::test_metadata_fetches_carry_no_cookie_or_credential
- id: GUIDE-fetch-03
  source: guide
  section: Fetching metadata safely
  level: SHOULD
  role: both
  text: Reject loopback, private, and link-local addresses unless you've configured them on purpose. Check
    the address you actually connect to, not only the one DNS returned first.
  status: implemented
  implementation:
  - personal_agent_protocol.reactor:PublicUrlSafetyPolicy.assert_safe
  - personal_agent_protocol.reactor:PinnedNetworkBackend
  - personal_agent_protocol.reactor:HttpxDiscoveryTransport.get
  tests:
  - personal_agent_protocol/__tests__/test_discovery.py::test_rejects_private_discovery_address
  - personal_agent_protocol/__tests__/test_real_sockets.py::test_metadata_connects_to_the_approved_address
  - personal_agent_protocol/__tests__/test_fuzz.py::test_url_safety_approves_only_https_public_addresses
  - personal_agent_protocol/__tests__/test_fixtures.py::test_local_fixture_case
  conformance:
  - security.ssrf-loopback
  - security.ssrf-private
  - security.ssrf-link-local-metadata
  - security.ssrf-ipv6-loopback-and-unique-local
  - security.ssrf-ipv4-mapped
  - security.dns-rebinding-mixed-answers
  - security.dns-rebinding-after-check
  - security.public-address-allowed
- id: GUIDE-fetch-04
  source: guide
  section: Fetching metadata safely
  level: SHOULD
  role: both
  text: Cache according to HTTP caching headers, within bounds you set, such as at least a minute and
    at most a day.
  status: implemented
  implementation:
  - personal_agent_protocol.caching:CacheBounds
  - personal_agent_protocol.caching:cache_lifetime
  - personal_agent_protocol.caching:MetadataCache
  - personal_agent_protocol.discovery:DiscoveryClient._get_json
  - personal_agent_protocol.identity:AgentIdentityClient._cached_json
  tests:
  - personal_agent_protocol/__tests__/test_guidance.py::test_cache_lifetime_follows_cache_control_within_bounds
  - personal_agent_protocol/__tests__/test_guidance.py::test_discovery_and_oauth_metadata_are_cached_until_they_expire
  - personal_agent_protocol/__tests__/test_guidance.py::test_no_store_metadata_is_fetched_every_time
- id: GUIDE-retry-01
  source: guide
  section: Retries
  level: SHOULD
  role: personal-agent
  text: Send an Idempotency-Key on API writes that accept one. Use a random UUID (version 4), and reuse
    the same key when you retry the same request.
  status: implemented
  implementation:
  - personal_agent_protocol.apis:ApiClient.call
  - personal_agent_protocol.apis:new_idempotency_key
  tests:
  - personal_agent_protocol/__tests__/test_idempotency.py::test_every_write_carries_a_random_uuid_v4_and_a_read_none
  - personal_agent_protocol/__tests__/test_idempotency.py::test_a_retry_sends_the_callers_key_and_a_refusal_carries_it
  - personal_agent_protocol/__tests__/test_idempotency.py::test_a_bad_key_or_a_key_on_a_read_is_the_callers_mistake
- id: GUIDE-retry-02
  source: guide
  section: Retries
  level: SHOULD
  role: personal-agent
  text: Each retry needs a new DPoP proof, and a retried token request needs a new assertion.
  status: implemented
  implementation:
  - personal_agent_protocol.transport:DpopHttpClient.request
  - personal_agent_protocol.sessions:SessionClient.token_request
  tests:
  - personal_agent_protocol/__tests__/test_sessions.py::test_retries_once_with_a_fresh_dpop_nonce_and_assertions
- id: GUIDE-retry-03
  source: guide
  section: Retries
  level: SHOULD
  role: personal-agent
  text: Otherwise, back off exponentially with jitter, cap the delay, and limit the number of attempts.
  status: implemented
  implementation:
  - personal_agent_protocol.reactor:RetryPolicy
  - personal_agent_protocol.transport:DpopHttpClient.request
  tests:
  - personal_agent_protocol/__tests__/test_guidance.py::test_retry_policy_honours_retry_after_backs_off_with_jitter_and_caps
  - personal_agent_protocol/__tests__/test_guidance.py::test_safe_requests_retry_after_retry_after_with_fresh_proofs
- id: GUIDE-retry-04
  source: guide
  section: Retries
  level: SHOULD
  role: company
  text: Companies keep idempotency records for a set time, such as a day, scoped to the session. They
    return the original response for a repeated key, and reject a repeated key with a different body.
  status: implemented
  implementation:
  - personal_agent_protocol.company.service:CompanyService._api_call
  - personal_agent_protocol.company.service:CompanyConfig.idempotency_lifetime
  - personal_agent_protocol.company.store:IdempotencyRecord
  tests:
  - personal_agent_protocol/__tests__/test_idempotency.py::test_the_reference_company_keeps_each_key_per_session_for_its_lifetime
  - personal_agent_protocol/__tests__/test_idempotency.py::test_a_bad_key_is_invalid_request_and_a_refusal_is_not_remembered
- id: GUIDE-rate-01
  source: guide
  section: Rate limits
  level: SHOULD
  role: company
  text: Limit by client_id, by user, and by session; also send the RateLimit and RateLimit-Policy headers.
  status: open
  reason: The reference company does not rate-limit.
  implementation: []
- id: GUIDE-rate-02
  source: guide
  section: Rate limits
  level: SHOULD
  role: personal-agent
  text: Keep track of limits for each company and share them across your tasks and users.
  status: implemented
  implementation:
  - personal_agent_protocol.reactor:RateLimitBudget
  - personal_agent_protocol.reactor:SharedRateLimitBudget
  - personal_agent_protocol.transport:DpopHttpClient.request
  tests:
  - personal_agent_protocol/__tests__/test_guidance.py::test_shared_budget_paces_tasks_and_refuses_long_waits
  - personal_agent_protocol/__tests__/test_guidance.py::test_writes_and_long_pauses_go_back_to_the_caller_and_are_shared
- id: GUIDE-rate-03
  source: guide
  section: Rate limits
  level: SHOULD
  role: company
  text: Count a request against a client_id only after its client assertion's signature checks pass. Limit
    unverified requests by network instead.
  status: implemented
  implementation:
  - personal_agent_protocol.company.service:CompanyService._caller
  - personal_agent_protocol.company.service:CompanyService._admitted
  tests:
  - personal_agent_protocol/__tests__/test_company_refusals.py::test_the_hosts_rate_limit_refuses_with_when_to_ask_again
- id: GUIDE-json-01
  source: guide
  section: Transport and JSON
  level: SHOULD
  role: both
  text: Encode JSON as UTF-8 and reject objects with duplicate member names.
  status: implemented
  implementation:
  - personal_agent_protocol.json:loads_strict
  tests:
  - personal_agent_protocol/__tests__/test_models.py::test_strict_json_rejects_duplicate_members
  - personal_agent_protocol/__tests__/test_fixtures.py::test_local_fixture_case
  - personal_agent_protocol/__tests__/test_fuzz.py::test_strict_json_accepts_every_unique_document_and_refuses_every_duplicate
  conformance:
  - security.duplicate-json-members
- id: GUIDE-pa-dpop-01
  source: guide
  section: DPoP keys and proofs
  level: SHOULD
  role: personal-agent
  text: Generate a DPoP key pair for each user ID (MUST, 4.3), so each user at each company has its own.
  status: implemented
  implementation:
  - personal_agent_protocol.reactor:DpopProofRequest
  - personal_agent_protocol.crypto:InMemorySessionKeys
  tests:
  - personal_agent_protocol/__tests__/test_conformance.py::test_python_agent_python_company_over_tls
- id: GUIDE-pa-dpop-02
  source: guide
  section: DPoP keys and proofs
  level: SHOULD
  role: personal-agent
  text: Sign proofs with ES256, which every company accepts (3.2). Use another algorithm only if the company
    lists it in dpop_signing_alg_values_supported.
  status: implemented
  implementation:
  - personal_agent_protocol.crypto:JoseDpopProofProvider
  - personal_agent_protocol.crypto:InMemorySessionKeys
  tests:
  - personal_agent_protocol/__tests__/test_crypto.py::test_creates_and_verifies_bound_dpop_proof_once
- id: GUIDE-pa-discovery-01
  source: guide
  section: Finding a company
  level: SHOULD
  role: personal-agent
  text: When the company you reach is on a different domain from the one the user asked for, tell the
    user which company you're dealing with, its organization.name and domain, before you sign in or act
    for them.
  status: partial
  implementation:
  - personal_agent_protocol.discovery:DiscoveryClient.discover
  - personal_agent_protocol.models:DiscoveredCompany
  tests:
  - personal_agent_protocol/__tests__/test_fixtures.py::test_local_fixture_case
  reason: Discovery returns the organization and the final discovery_url, so a host can tell the user;
    the SDK has no step of its own that tells them.
- id: GUIDE-pa-ids-01
  source: guide
  section: User IDs
  level: SHOULD
  role: personal-agent
  text: Key user IDs by the company's full auth.issuer, including any path, not by its host.
  status: implemented
  implementation:
  - personal_agent_protocol.pairwise:SqlitePairwiseUserIdStore
  tests:
  - personal_agent_protocol/__tests__/test_pairwise.py::test_persists_stable_pairwise_ids_by_exact_tenant_user_and_issuer
- id: GUIDE-pa-ids-02
  source: guide
  section: User IDs
  level: SHOULD
  role: personal-agent
  text: Tell your users, such as in your privacy notice, that each company recognizes them across visits
    through their user ID, even when they're signed out.
  status: not-applicable
  reason: A privacy notice is the host's.
  implementation: []
- id: GUIDE-pa-ids-03
  source: guide
  section: User IDs
  level: SHOULD
  role: personal-agent
  text: Create a random ID and a new DPoP key for each anonymous browsing session; discard both when it
    ends; never sign in with an anonymous ID.
  status: not-applicable
  reason: The SDK offers no anonymous browsing mode (see PAP-4.2-10).
  implementation: []
- id: GUIDE-pa-ids-04
  source: guide
  section: User IDs
  level: SHOULD
  role: personal-agent
  text: Keep the mapping of each user's IDs across companies confidential (MUST, 4.2).
  status: implemented
  implementation:
  - personal_agent_protocol.pairwise:SqlitePairwiseUserIdStore
  tests:
  - personal_agent_protocol/__tests__/test_pairwise.py::test_persists_stable_pairwise_ids_by_exact_tenant_user_and_issuer
- id: GUIDE-pa-tokens-01
  source: guide
  section: Storing tokens
  level: SHOULD
  role: personal-agent
  text: Include resource in every token request for an MCP server, and use the scheme token_type names
    (MUST, 4.3). Bearer tokens can be used by anyone who copies them. Each one is limited to one MCP server
    by resource.
  status: implemented
  implementation:
  - personal_agent_protocol.mcp:McpBearerAuth
  - personal_agent_protocol.transport:DpopHttpClient.request
  tests:
  - personal_agent_protocol/__tests__/test_mcp_and_web.py::test_an_mcp_token_is_refused_everywhere_but_its_mcp_server
  - personal_agent_protocol/__tests__/test_conformance.py::test_python_agent_python_company_over_tls
  - personal_agent_protocol/__tests__/test_sessions.py::test_a_bearer_token_for_an_mcp_server_comes_from_token_exchange
  conformance:
  - lifecycle.mcp-bearer-for-its-url
- id: GUIDE-pa-tokens-02
  source: guide
  section: Storing tokens
  level: SHOULD
  role: personal-agent
  text: On invalid_grant for an account token, delete it and continue signed out.
  status: implemented
  implementation:
  - personal_agent_protocol.accounts:AccountTokenClient.refresh
  tests:
  - personal_agent_protocol/__tests__/test_accounts.py::test_invalid_grant_then_a_renewal_that_works_means_the_account_token_ended
  - personal_agent_protocol/__tests__/test_conformance.py::test_python_agent_python_company_over_tls
- id: GUIDE-pa-tokens-03
  source: guide
  section: Storing tokens
  level: SHOULD
  role: personal-agent
  text: Store account tokens by the company's full auth.issuer, as for user IDs, so a token from one company
    hosted by a provider is never sent to another.
  status: partial
  implementation:
  - personal_agent_protocol.accounts:AccountTokenContext
  - personal_agent_protocol.cli_host:SessionRecord
  tests:
  - personal_agent_protocol/__tests__/test_accounts.py::test_no_error_carries_the_account_token
  reason: Account Tokens sit behind opaque references kept with their Session's record and its issuer;
    the TokenStore contract itself is not keyed by issuer.
- id: GUIDE-pa-device-01
  source: guide
  section: Device sign-in
  level: SHOULD
  role: personal-agent
  text: Show the link only if its host is the company's issuer host or the host of one of its protected_resources,
    or a subdomain of either, and show the company's name and domain with it (MUST, 4.6).
  status: implemented
  implementation:
  - personal_agent_protocol.device:verification_host_allowed
  - personal_agent_protocol.device:DeviceSignInStart
  tests:
  - personal_agent_protocol/__tests__/test_device.py::test_a_device_link_is_shown_only_on_the_issuer_or_its_domains
- id: GUIDE-pa-mediated-01
  source: guide
  section: Mediated sign-in
  level: SHOULD
  role: personal-agent
  text: Look up stored credentials by the company's auth.issuer, and show the company's name and domain
    on the form and when asking for a code (MUST, 4.7).
  status: implemented
  implementation:
  - personal_agent_protocol.reactor:ProtectedInputRequest
  tests:
  - personal_agent_protocol/__tests__/test_company_rules.py::test_mediated_sign_in_of_a_session_tied_to_another_account_is_account_mismatch
- id: GUIDE-pa-mediated-02
  source: guide
  section: Mediated sign-in
  level: SHOULD
  role: personal-agent
  text: After sign-in, you MUST either discard the credentials or keep them only in a credential store
    the user chose (4.7). After the user disconnects you or the company revokes your access, don't sign
    in again with stored credentials unless the user asks you to.
  status: implemented
  implementation:
  - personal_agent_protocol.mediated:MediatedSignInClient
  tests:
  - personal_agent_protocol/__tests__/test_canaries.py::test_no_credential_reaches_logs_errors_urls_or_model_text
- id: GUIDE-pa-signin-01
  source: guide
  section: Choosing how to sign in
  level: SHOULD
  role: personal-agent
  text: Prefer direct sign-in, then device sign-in, then mediated sign-in.
  status: open
  reason: The SDK offers all three; no helper chooses among them.
  implementation: []
- id: GUIDE-pa-browser-01
  source: guide
  section: Web browsing
  level: SHOULD
  role: personal-agent
  text: Use a separate browser storage context, with its own cookies and local storage, for each session.
  status: open
  reason: The browser is a host contribution (pap.browserFormPost); isolation is not checked.
  implementation: []
- id: GUIDE-pa-conv-01
  source: guide
  section: Conversations
  level: SHOULD
  role: personal-agent
  text: Read events with a long wait, such as 30 seconds, or a stream, rather than many short polls (7.5).
  status: implemented
  implementation:
  - personal_agent_protocol.conversations:ConversationClient.events
  tests:
  - personal_agent_protocol/__tests__/test_conversations.py::test_events_recover_cursor_drain_backlog_and_suppress_duplicates
- id: GUIDE-co-consent-01
  source: guide
  section: Consent pages
  level: SHOULD
  role: company
  text: 'Protect the page against cross-site request forgery, and against framing by other sites with
    Content-Security-Policy: frame-ancestors.'
  status: implemented
  implementation:
  - personal_agent_protocol.company.service:CompanyService._page
  - personal_agent_protocol.company.service:CompanyService.consent_decision
  - personal_agent_protocol.company.service:CompanyService._operation_page
  tests:
  - personal_agent_protocol/__tests__/test_direct_and_api.py::test_the_consent_page_is_never_framed_and_bad_redirects_are_not_followed
  - personal_agent_protocol/__tests__/test_guide_security.py::test_the_consent_form_is_bound_to_the_browser_that_was_shown_it
  - personal_agent_protocol/__tests__/test_guide_security.py::test_the_operation_page_refuses_cross_site_and_another_browsers_form
- id: GUIDE-co-consent-02
  source: guide
  section: Consent pages
  level: SHOULD
  role: company
  text: Accept PKCE with S256 only, and reject plain.
  status: implemented
  implementation:
  - personal_agent_protocol.company.service:CompanyService._authorize
  tests:
  - personal_agent_protocol/__tests__/test_direct_and_api.py::test_the_consent_page_is_never_framed_and_bad_redirects_are_not_followed
- id: GUIDE-co-consent-03
  source: guide
  section: Consent pages
  level: SHOULD
  role: company
  text: Return iss in every redirect, success or error (MUST, 4.5).
  status: implemented
  implementation:
  - personal_agent_protocol.company.service:CompanyService._redirect_url
  tests:
  - personal_agent_protocol/__tests__/test_direct_and_api.py::test_a_denial_reaches_the_agent_as_access_denied_only
- id: GUIDE-co-device-01
  source: guide
  section: Device sign-in
  level: SHOULD
  role: company
  text: Return slow_down to personal agents that poll faster than interval, and keep expires_in short,
    such as 10 minutes.
  status: implemented
  implementation:
  - personal_agent_protocol.company.service:CompanyService._device_grant
  - personal_agent_protocol.company.service:CompanyService._device
  tests:
  - personal_agent_protocol/__tests__/test_company_refusals.py::test_polling_too_fast_is_slow_down
- id: GUIDE-co-mediated-01
  source: guide
  section: Mediated sign-in
  level: SHOULD
  role: company
  text: Return the same failed response for an unknown account and a wrong password, so responses don't
    reveal whether an account exists.
  status: implemented
  implementation:
  - personal_agent_protocol.company.service:CompanyService._mediated
  tests:
  - personal_agent_protocol/__tests__/test_company_end_to_end.py::test_mediated_sign_in_with_a_one_time_code
- id: GUIDE-co-mediated-02
  source: guide
  section: Mediated sign-in
  level: SHOULD
  role: company
  text: Require a one-time code when a sign-in looks unusual, including a personal agent's first mediated
    sign-in after the user disconnected it.
  status: open
  implementation:
  - personal_agent_protocol.company.service:CompanyService._mediated
  reason: Whether a code is required is the account directory's answer (Authenticated.code_reference);
    the company does not yet ask for one because of a disconnect.
- id: GUIDE-co-dpop-01
  source: guide
  section: DPoP proofs
  level: SHOULD
  role: company
  text: Check that typ is dpop+jwt, that alg is ES256 or one you list in dpop_signing_alg_values_supported
    (3.2), and that jwk holds only a public key.
  status: implemented
  implementation:
  - personal_agent_protocol.crypto:verify_dpop_proof
  - personal_agent_protocol.company.service:DPOP_ALGORITHMS
  tests:
  - personal_agent_protocol/__tests__/test_crypto.py::test_rejects_private_dpop_jwk_in_protected_header
- id: GUIDE-co-dpop-02
  source: guide
  section: DPoP proofs
  level: SHOULD
  role: company
  text: Keep a replay cache keyed by jti, holding entries for the acceptance window. Your token endpoint
    MUST have one, shared by every server behind it.
  status: implemented
  implementation:
  - personal_agent_protocol.company.points:StoreReplayCache
  tests:
  - personal_agent_protocol/__tests__/test_load.py::test_concurrent_replays_of_one_proof_and_one_assertion_accept_exactly_one
- id: GUIDE-co-dpop-03
  source: guide
  section: DPoP proofs
  level: SHOULD
  role: company
  text: Accept a Bearer session token only at the MCP server whose url is its resource, not at other paths
    on the same host (MUST, 4.3).
  status: implemented
  implementation:
  - personal_agent_protocol.company.service:CompanyService._mcp_caller
  tests:
  - personal_agent_protocol/__tests__/test_mcp_and_web.py::test_an_mcp_token_is_refused_everywhere_but_its_mcp_server
- id: GUIDE-co-dpop-04
  source: guide
  section: DPoP proofs
  level: SHOULD
  role: company
  text: 'Support DPoP on a new MCP server (SHOULD, 4.3): list dpop_signing_alg_values_supported in its
    protected resource metadata, with ES256, and verify proofs as on your other APIs. Then issue personal
    agents only DPoP tokens for it. Keep accepting Bearer tokens from MCP clients that don''t implement
    Poppy, and reject a DPoP token sent as a Bearer token.'
  status: implemented
  implementation:
  - personal_agent_protocol.company.service:CompanyService.protected_resource_metadata
  - personal_agent_protocol.company.service:CompanyService._mcp_caller
  - personal_agent_protocol.company.service:CompanyService._token
  tests:
  - personal_agent_protocol/__tests__/test_mcp_and_web.py::test_the_token_type_is_chosen_by_the_mcp_server
  - personal_agent_protocol/__tests__/test_mcp_and_web.py::test_an_mcp_token_is_refused_everywhere_but_its_mcp_server
- id: GUIDE-co-sessions-01
  source: guide
  section: Sessions and tokens
  level: SHOULD
  role: company
  text: Don't stop accepted work because the session token that started it expired. A job can outlast
    the token (4.9).
  status: partial
  implementation:
  - personal_agent_protocol.company.service:CompanyService.settle
  - personal_agent_protocol.company.service:CompanyService._perform
  tests:
  - personal_agent_protocol/__tests__/test_operations.py::test_operations_are_used_only_when_both_sides_list_version_1
  reason: An operation in progress is settled by the company (settle) whatever its Session Token; no test
    lets a token expire mid-work.
- id: GUIDE-co-sessions-02
  source: guide
  section: Sessions and tokens
  level: SHOULD
  role: company
  text: Where work in progress can take consequential actions on the user's account, tie it to the account
    token, so revoking access stops it right away.
  status: not-applicable
  reason: The reference company performs an operation when it is confirmed; nothing runs on the account
    afterwards that revocation would need to stop.
  implementation: []
- id: GUIDE-co-hosting-01
  source: guide
  section: Hosting several companies
  level: SHOULD
  role: company
  text: 'Each company needs its own issuer: publish metadata for each issuer at its own URL, serve each
    storefront''s poppy.json on its own domain, record the issuer with every session and account token,
    and don''t use one company''s records for another.'
  status: not-applicable
  reason: The reference company is one company per CompanyService and store; a provider runs one per company,
    each with its own issuer and records.
  implementation: []
- id: GUIDE-co-account-01
  source: guide
  section: Account settings
  level: SHOULD
  role: company
  text: Offer a control to disconnect each one. Disconnecting revokes its account tokens and signs out
    its sessions (4.9).
  status: implemented
  implementation:
  - personal_agent_protocol.company.service:CompanyService.disconnect
  tests:
  - personal_agent_protocol/__tests__/test_conformance.py::test_python_agent_python_company_over_tls
  conformance:
  - lifecycle.disconnect-from-account-settings
- id: GUIDE-co-conv-01
  source: guide
  section: Conversations
  level: SHOULD
  role: company
  text: On a stream with nothing to send, send an SSE comment every 15 to 30 seconds, so proxies don't
    close it (7.6).
  status: partial
  implementation:
  - personal_agent_protocol.company.service:CompanyService._stream
  reason: The stream opens with a comment and ends after the backlog; it does not stay open with keep-alives.
- id: GUIDE-co-conv-02
  source: guide
  section: Conversations
  level: SHOULD
  role: company
  text: When a session signs out, answer a signed-out token on its conversations that used the account
    with insufficient_scope, including reads of their events. Leave them open, so the user can sign in
    again and continue.
  status: implemented
  implementation:
  - personal_agent_protocol.company.service:CompanyService._owned
  tests:
  - personal_agent_protocol/__tests__/test_conformance.py::test_python_agent_python_company_over_tls
  - personal_agent_protocol/__tests__/test_company_rules.py::test_after_sign_out_what_used_the_account_stays_and_asks_for_sign_in
- id: GUIDE-co-errors-01
  source: guide
  section: Error messages
  level: SHOULD
  role: company
  text: Return the same error for "doesn't exist" and "belongs to someone else", as conversation_not_found
    does (7.13).
  status: implemented
  implementation:
  - personal_agent_protocol.company.service:CompanyService._owned
  - personal_agent_protocol.company.service:CompanyService._operation_route
  tests:
  - personal_agent_protocol/__tests__/test_conformance.py::test_python_agent_python_company_over_tls
- id: GUIDE-ops-pa-01
  source: guide
  section: 'Operations: personal agents'
  level: SHOULD
  role: personal-agent
  text: When a new revision arrives, show the user what changed before asking them to approve it again.
  status: implemented
  implementation:
  - personal_agent_protocol.operations:ConfirmOutcome.changed
  tests:
  - personal_agent_protocol/__tests__/test_operations.py::test_terms_changed_returns_the_new_revision_and_what_changed
  - personal_agent_protocol/__tests__/test_conformance.py::test_python_agent_python_company_over_tls
- id: GUIDE-ops-pa-02
  source: guide
  section: 'Operations: personal agents'
  level: SHOULD
  role: personal-agent
  text: If a term you need to check is missing from terms, ask the user instead.
  status: implemented
  implementation:
  - personal_agent_protocol.operations:covers
  tests:
  - personal_agent_protocol/__tests__/test_operations.py::test_a_standing_permission_that_does_not_cover_it_asks_the_user
- id: GUIDE-ops-pa-03
  source: guide
  section: 'Operations: personal agents'
  level: SHOULD
  role: personal-agent
  text: For a permission with a limited number of uses, reserve a use before you confirm, so two tasks
    running at once can't both use the last one. Release the reservation if the company rejects the confirmation.
  status: implemented
  implementation:
  - personal_agent_protocol.operations:StandingPermissionStore
  - personal_agent_protocol.operations:OperationsClient.confirm
  tests:
  - personal_agent_protocol/__tests__/test_operations.py::test_a_refused_confirmation_gives_the_use_back
  - personal_agent_protocol/__tests__/test_conformance.py::test_python_agent_python_company_over_tls
  conformance:
  - operations.standing-permission-within-bounds
  - operations.standing-permission-concurrent-use
- id: GUIDE-ops-pa-04
  source: guide
  section: 'Operations: personal agents'
  level: SHOULD
  role: personal-agent
  text: After a confirm times out, read the operation or confirm again with the same revision. Wait for
    Retry-After between reads.
  status: implemented
  implementation:
  - personal_agent_protocol.operations:OperationsClient.confirm
  tests:
  - personal_agent_protocol/__tests__/test_operations.py::test_a_lost_answer_is_read_back_by_the_same_id_never_assumed_failed
  - personal_agent_protocol/__tests__/test_conformance.py::test_python_agent_python_company_over_tls
  conformance:
  - operations.confirm-timeout-recovery
- id: GUIDE-ops-co-01
  source: guide
  section: 'Operations: companies'
  level: SHOULD
  role: company
  text: When you call another system to perform the action, derive its idempotency key from the operation
    ID.
  status: implemented
  implementation:
  - personal_agent_protocol.company.points:OperationExecutor
  tests:
  - personal_agent_protocol/__tests__/test_conformance.py::test_python_agent_python_company_over_tls
- id: GUIDE-ops-co-02
  source: guide
  section: 'Operations: companies'
  level: SHOULD
  role: company
  text: To spot the same action coming up in another channel, look for an open operation in the same session
    or account with the same terms before proposing a new one.
  status: implemented
  implementation:
  - personal_agent_protocol.company.service:CompanyService._propose
  tests:
  - personal_agent_protocol/__tests__/test_conformance.py::test_python_agent_python_company_over_tls
