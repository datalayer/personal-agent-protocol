[build-system]
requires = ["hatchling~=1.21"]
build-backend = "hatchling.build"

[project]
name = "personal-agent-protocol"
authors = [{ name = "Datalayer", email = "info@datalayer.io" }]
dynamic = ["version"]
description = "Python SDK for Personal Agent Protocol draft 0.3 (2026-10-28) and its Operations extension v2"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["AI", "Agents", "OAuth", "MCP", "Personal Agent Protocol"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "datalayer_reactor>=1.0.5,<2",
  "httpx>=0.27,<1",
  "PyJWT[crypto]>=2.13,<3",
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
  "typer>=0.12,<1",
]

[project.scripts]
pap = "personal_agent_protocol.cli:main"

[project.entry-points."datalayer.reactor.cli"]
pap = "personal_agent_protocol.cli_plugin:plugin"

[project.optional-dependencies]
test = [
  "pytest>=7.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=4.1",
  "uvicorn>=0.30",
  # The shared fixtures checked against upstream's JSON Schemas (protocol/schemas).
  "jsonschema>=4.18",
  # The displays' tests (the `ui` extra).
  "datalayer_reactor>=1.1.0,<2",
  # The OpenTelemetry adapter's tests and the trace canaries (the `telemetry` extra).
  "opentelemetry-sdk>=1.27,<2",
]
# Serve the reference company (and the demo worlds) over real sockets.
server = ["uvicorn>=0.30"]
lint = ["mdformat>0.7", "mdformat-gfm>=0.3.5", "ruff"]
typing = ["mypy>=0.990"]
# The Pydantic AI examples; `sign-in-display` draws a `ui` display.
examples = ["pydantic-ai-slim[openai]>=2.35.0,<3", "datalayer_reactor>=1.1.0,<2"]
# `personal_agent_protocol.ui`: PAP's displays for reactor.ui.
ui = ["datalayer_reactor>=1.1.0,<2"]
# `telemetry.OpenTelemetrySink`: the SDK's protocol stages as OpenTelemetry spans.
telemetry = ["opentelemetry-api>=1.27,<2"]

[project.license]
file = "LICENSE"

[project.urls]
Home = "https://github.com/datalayer/personal-agent-protocol"
Documentation = "https://personalagentprotocol.org/docs"
Specification = "https://personalagentprotocol.org/docs/spec"

[tool.hatch.version]
path = "personal_agent_protocol/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["personal_agent_protocol"]

# The requirement ledger and conformance fixtures, read by `pap requirements`
# and `pap conformance` (personal_agent_protocol.requirements.protocol_path).
[tool.hatch.build.targets.wheel.force-include]
"protocol" = "personal_agent_protocol/protocol"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
markers = [
  "load: bounded load tests, sized by PAP_LOAD_SIZE (64 by default; the load CI job runs 512)",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
exclude = ["^personal_agent_protocol/__tests__/"]
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
pretty = true
show_error_context = true
show_error_codes = true
strict_equality = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
  "A",
  "B",
  "C",
  "E",
  "F",
  "FBT",
  "I",
  "N",
  "Q",
  "RUF",
  "S",
  "T",
  "UP",
  "W",
  "YTT",
]
ignore = ["FBT001", "FBT002", "FBT003"]

[tool.ruff.lint.per-file-ignores]
"personal_agent_protocol/__tests__/**/*.py" = ["S101", "S105"]
# OAuth's token type and auth method names, which newer ruff reads as passwords.
"personal_agent_protocol/models.py" = ["S105"]
"personal_agent_protocol/sessions.py" = ["S105"]
